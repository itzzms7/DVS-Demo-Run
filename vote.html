<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cast Your Vote — DVS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="index.html" class="logo"><span class="logo-mark">DV</span>DVS</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="vote.html" class="active">Cast Your Vote</a>
        <a href="admin-login.html">Admin Login</a>
        <span class="nav-tag">Demo Mode</span>
    </div>
</div>

<main>
    <!-- HERO -->
    <section class="hero">
        <span class="eyebrow">Step 1 of 3</span>
        <h1>Choose your candidate</h1>
        <p>Select one candidate below, then continue to verify your identity.</p>
    </section>

    <!-- MAIN CONTENT -->
    <div class="card">
        <div class="section-heading">
            <h3>Candidates</h3>
        </div>

        <div class="candidate-grid" id="candidateGrid"></div>

        <div class="card-narrow" style="margin: 26px auto 0;">
            <button class="btn-primary" id="continueBtn" disabled>Continue to Voter Login</button>
        </div>
    </div>
</main>

<!-- FOOTER -->
<div class="footer">
    © 2026 DVS — Digital Voting System
    <span class="demo-note">This is a demo build. All votes and identities are simulated and stored only in your browser.</span>
</div>

<script src="js/app.js"></script>
<script>
    const grid = document.getElementById('candidateGrid');
    const continueBtn = document.getElementById('continueBtn');
    let selectedId = sessionStorage.getItem('dvs_selected_candidate') || null;

    function render() {
        grid.innerHTML = '';
        DVS.getCandidates().forEach(c => {
            const card = document.createElement('div');
            card.className = 'candidate-card' + (c.id === selectedId ? ' selected' : '');
            card.innerHTML = `
                <div class="avatar" style="background:${c.color}">${c.initials}</div>
                <div class="candidate-name">${c.name}</div>
                <div class="candidate-party">${c.party}</div>
                <button class="btn-select ${c.id === selectedId ? 'is-selected' : ''}" data-id="${c.id}">
                    ${c.id === selectedId ? 'Selected' : 'Select'}
                </button>
            `;
            grid.appendChild(card);
        });
        continueBtn.disabled = !selectedId;
    }

    grid.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-select');
        if (!btn) return;
        selectedId = btn.dataset.id;
        sessionStorage.setItem('dvs_selected_candidate', selectedId);
        render();
    });

    continueBtn.addEventListener('click', () => {
        if (!selectedId) return;
        window.location.href = 'voter-login.html';
    });

    render();
</script>

</body>
</html>
